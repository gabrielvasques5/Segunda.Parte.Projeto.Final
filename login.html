<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Copa do Brasil</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1>🏆 Copa do Brasil</h1>

            <h2>Entrar</h2>

            <form id="form-login">

                <label for="email-login">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email-login"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="mensagem-login"></p>

            <a href="index.html">
                ← Voltar para o site
            </a>

        </div>

    </main>

    <script src="login.js"></script>

</body>

</html>
